<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Umpire Selection</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<style>
	body {
		font-family: sans-serif;
		background: #000;
		color: #eee;
		margin: 0;
		padding: 0;
	}
	.bup-container {
		text-align: center;
		padding: 2vh 2vw;
	}
	h1 {
		margin-top: 0;
		font-size: 5vh;
	}
	.umpire-buttons {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
	}
	.umpire_button {
		flex: 1 1 250px;
		margin: 1vh 1vw;
		padding: 3vh 2vw;
		font-size: 4vh;
		background: #eee;
		border: 1px solid #ccc;
		border-radius: 1vh;
		cursor: pointer;
		color: #000;
		min-width: 250px;
		white-space: pre-wrap;
		text-decoration: none;
		display: inline-block;
	}
	.umpire_button:hover {
		background: #ddd;
	}
	.umpire_button:active {
		background: #bbb;
	}
	</style>
</head>
<body>
	<div class="bup-container">
		<h1>Select Umpire</h1>
		<div class="umpire-buttons">
			{{umpire-list}}
		</div>
	</div>
	<script>
	function on_umpire_click(el) {
		const umpire_id = el.getAttribute('data-umpire-id');
		const umpire_name = el.getAttribute('data-umpire-name');
		const court_id = el.getAttribute('data-court-id');
		try {
			const settings_json = localStorage.getItem('bup_settings');
			const settings = settings_json ? JSON.parse(settings_json) : {};
			settings.umpire_id = umpire_id;
			settings.umpire_name = umpire_name;
			if (court_id) {
				settings.court_id = court_id;
			}
			settings.court_selection_type = 'umpire';
			localStorage.setItem('bup_settings', JSON.stringify(settings));
		} catch (e) {
			// Ignore
		}
		return true;
	}
	</script>
</body>
</html>
