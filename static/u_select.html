<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Umpire Selection</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" type="text/css" href="/static/css/bup.css">
	<style>
	.umpire-buttons {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
	}
	.umpire-buttons > .button {
		flex: 1 1 250px;
		margin: 2px;
		font-size: 1.2em;
	}
	</style>
</head>
<body>
	<div class="bup-container">
		<h1>Select Umpire</h1>
		<div class="umpire-buttons">
			{{umpire-list}}
		</div>
	</div>
	<script>
	function on_umpire_click(el) {
		const umpire_id = el.getAttribute('data-umpire-id');
		const umpire_name = el.getAttribute('data-umpire-name');
		try {
			const settings_json = localStorage.getItem('bup_settings');
			const settings = settings_json ? JSON.parse(settings_json) : {};
			settings.umpire_id = umpire_id;
			settings.umpire_name = umpire_name;
			settings.court_selection_type = 'umpire';
			localStorage.setItem('bup_settings', JSON.stringify(settings));
		} catch (e) {
			// Ignore
		}
		return true;
	}
	</script>
</body>
</html>
